# Konfigurasi pytest untuk Sistem Informasi Restoran Dapur Ina Aina
# =================================================================
# Dipakai pada Tugas 4 (pengujian unit). pytest-django membaca berkas ini
# untuk mengetahui modul pengaturan Django yang dipakai saat pengujian.
#
# Menjalankan seluruh pengujian unit:
#   pytest
#
# Menjalankan satu berkas pengujian saja:
#   pytest core/tests/test_models.py -v

[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py

# Tampilkan nama pengujian yang berjalan supaya mudah ditunjukkan
# satu per satu kepada asesor.
addopts = -v --tb=short
